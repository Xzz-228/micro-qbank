<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12213a">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="微观经济学题库">
<title>微观经济学题库 · 经济与金融专业（考研）</title>
<style>
  :root{
    --paper:#f5f0e6;
    --card:#ffffff;
    --ink:#1b2738;
    --ink-2:#46566d;
    --muted:#8c98a8;
    --line:#e9e1d1;
    --gold:#b1813a;
    --accent:#2e5c8a;
    --ok:#2f8f6a;
    --bad:#c0453f;
    --warn:#c08a2e;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 8% -8%, #fdfaf3 0%, transparent 60%),
      radial-gradient(900px 480px at 100% 0%, #edf2f8 0%, transparent 55%),
      var(--paper);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  button, .tab, .opt, .nav-btn{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .serif{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;}

  /* ============ 头部 ============ */
  .hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#12213a 0%,#1b3253 55%,#24446b 100%);
    color:#fff;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(700px 340px at 82% 18%, rgba(214,178,110,.20), transparent 70%),
      radial-gradient(520px 280px at 6% 110%, rgba(96,150,210,.22), transparent 72%);
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-90px;top:-90px;
    width:320px;height:320px;
    border:1px solid rgba(214,178,110,.28);
    border-radius:50%;
  }
  .hero-inner{
    position:relative;
    max-width:1000px;
    margin:0 auto;
    padding:52px 32px 46px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.34em;
    color:#d6b26e;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .hero h1{
    margin:0;
    font-size:40px;
    font-weight:700;
    letter-spacing:.04em;
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  }
  .hero h1 span{color:#d6b26e;}
  .hero-sub{
    margin:14px 0 0;
    color:rgba(255,255,255,.78);
    font-size:15px;
    letter-spacing:.06em;
  }
  .hero-stats{
    display:flex;
    gap:36px;
    margin-top:30px;
    flex-wrap:wrap;
  }
  .stat b{
    display:block;
    font-size:22px;
    color:#fff;
    font-family:"Songti SC","SimSun",serif;
    letter-spacing:.02em;
  }
  .stat span{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.12em;}
  .stat + .stat{padding-left:36px;border-left:1px solid rgba(255,255,255,.16);}

  /* ============ 主体 ============ */
  .wrap{max-width:1000px;margin:0 auto;padding:26px 24px 70px;}

  .tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
  }
  .tab{
    appearance:none;
    border:1px solid var(--line);
    background:rgba(255,255,255,.72);
    border-radius:12px;
    padding:14px 16px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink-2);
    transition:.18s;
  }
  .tab:hover{border-color:#d9c79f;transform:translateY(-1px);}
  .tab .t-name{
    display:block;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    font-family:"Songti SC","SimSun",serif;
    letter-spacing:.06em;
  }
  .tab .t-topic{
    display:block;
    margin-top:3px;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .tab .t-score{
    float:right;
    font-size:12px;
    color:var(--gold);
    font-weight:700;
  }
  .tab.active{
    background:#fff;
    border-color:#c9a86a;
    box-shadow:0 6px 20px rgba(27,39,56,.10);
  }
  .tab.active .t-name{color:var(--accent);}

  /* 工具条 */
  .toolbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    gap:18px;
    background:rgba(250,247,241,.92);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 18px;
    margin-bottom:14px;
    box-shadow:0 4px 16px rgba(27,39,56,.05);
  }
  .progress-box{flex:1;min-width:0;}
  .progress-text{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:5px;
    letter-spacing:.04em;
  }
  .progress-text b{color:var(--ink-2);}
  .bar{height:6px;border-radius:999px;background:#eae3d4;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#c9a86a,#b1813a);transition:width .3s;}
  .score-chip{
    flex:none;
    font-size:12.5px;
    color:var(--muted);
    border-left:1px solid var(--line);
    padding-left:18px;
    letter-spacing:.03em;
  }
  .score-chip b{
    font-family:"Songti SC","SimSun",serif;
    font-size:22px;
    color:var(--accent);
    margin-right:2px;
  }
  .score-chip b.pass{color:var(--ok);}
  .score-chip b.fail{color:var(--bad);}

  /* 题号导航 */
  .nav-grid{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    padding:14px 16px;
    background:#fffdf8;
    border:1px dashed #ddd0b4;
    border-radius:12px;
    margin-bottom:18px;
  }
  .nav-hint{
    font-size:12px;
    color:var(--muted);
    width:100%;
    margin-bottom:2px;
    letter-spacing:.04em;
  }
  .nav-btn{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-2);
    font-size:13px;
    cursor:pointer;
    transition:.15s;
    font-family:inherit;
  }
  .nav-btn:hover{border-color:var(--gold);}
  .nav-btn.answered{background:#f6edd9;border-color:#dcc79a;color:#8a6520;}
  .nav-btn.correct{background:#e9f6ef;border-color:#9fd2b9;color:#1f7a58;}
  .nav-btn.wrong{background:#fbeceb;border-color:#e5b6b2;color:#b4453f;}
  .nav-btn.partial{background:#fdf3e0;border-color:#e7c98d;color:#9a6a15;}
  .nav-btn.pending{background:#f2f4f7;border-color:#cfd8e3;color:#7d8b9e;border-style:dashed;}

  /* 成绩横幅 */
  .banner{
    display:none;
    margin-bottom:18px;
    border-radius:14px;
    padding:22px 26px;
    background:linear-gradient(120deg,#14243c,#26456c);
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .banner.show{display:block;animation:fadeUp .4s ease;}
  .banner::after{
    content:"";
    position:absolute;right:-40px;bottom:-70px;
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(214,178,110,.28),transparent 68%);
  }
  .banner-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
  .banner-score{
    font-family:"Songti SC","SimSun",serif;
    font-size:44px;line-height:1;
    color:#e5c98f;
  }
  .banner-score small{font-size:15px;color:rgba(255,255,255,.6);}
  .banner-level{
    font-size:13px;letter-spacing:.14em;
    padding:4px 12px;border:1px solid rgba(229,201,143,.5);
    border-radius:999px;color:#e5c98f;
    margin-bottom:6px;
  }
  .banner-detail{
    margin-top:14px;font-size:13px;color:rgba(255,255,255,.75);
    line-height:1.9;
  }
  .banner-detail b{color:#fff;}

  /* ============ 题目卡 ============ */
  .q-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 26px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 14px rgba(27,39,56,.045);
    scroll-margin-top:90px;
  }
  .q-card::before{
    content:"";
    position:absolute;left:0;top:20px;bottom:20px;width:3px;
    border-radius:0 3px 3px 0;background:var(--accent);
  }
  .q-card[data-type="multi"]::before{background:#6b5bb5;}
  .q-card[data-type="judge"]::before{background:#3f947f;}
  .q-card[data-type="calc"]::before{background:#c2853a;}
  .q-card[data-type="essay"]::before{background:#b3546b;}
  .q-card.flash{animation:flash 1s ease;}
  @keyframes flash{0%,100%{box-shadow:0 2px 14px rgba(27,39,56,.045);}35%{box-shadow:0 0 0 3px rgba(201,168,106,.45);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .q-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:12px;
  }
  .q-no{
    width:32px;height:32px;border-radius:50%;
    background:#f3efe5;color:#8a6520;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;
    font-family:"Songti SC","SimSun",serif;
    flex:none;
  }
  .badge{
    font-size:11.5px;letter-spacing:.08em;
    padding:3px 9px;border-radius:5px;
    background:#eef3fa;color:#3d6ea8;
  }
  .badge.multi{background:#f0ecfa;color:#6b5bb5;}
  .badge.judge{background:#e9f6f1;color:#2f8f6a;}
  .badge.calc{background:#fcf1e3;color:#b4792c;}
  .badge.essay{background:#fceef1;color:#b3546b;}
  .q-points{
    margin-left:auto;
    font-size:12px;color:var(--muted);letter-spacing:.04em;
  }
  .q-points b{color:var(--ink-2);}
  .q-gain{
    font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;
    background:#e9f6ef;color:#2f8f6a;
  }
  .q-gain.zero{background:#fbeceb;color:var(--bad);}
  .q-gain.half{background:#fdf3e0;color:var(--warn);}

  .q-stem{
    font-size:15.5px;
    color:#233246;
    margin-bottom:14px;
    line-height:1.85;
  }
  .q-sub{
    display:block;margin-top:8px;font-size:13px;color:var(--muted);
  }

  /* 选项 */
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{
    display:flex;align-items:flex-start;gap:11px;
    padding:10px 14px;
    border:1px solid #ebe4d5;
    border-radius:10px;
    cursor:pointer;
    transition:.16s;
    background:#fff;
  }
  .opt:hover{border-color:#d9c79f;background:#fdfbf6;}
  .opt input{
    position:absolute;opacity:0;width:0;height:0;
  }
  .opt-key{
    flex:none;
    width:24px;height:24px;border-radius:50%;
    background:#f4efe4;color:#8a7346;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;
    margin-top:2px;
    transition:.16s;
  }
  .opt-text{font-size:14.5px;color:#2b3a4d;line-height:1.7;}
  .opt.chosen{border-color:var(--accent);background:#f3f8fd;box-shadow:0 0 0 2px rgba(46,92,138,.07);}
  .opt.chosen .opt-key{background:var(--accent);color:#fff;}
  .opt.correct{border-color:#4aa886;background:#eef8f3;}
  .opt.correct .opt-key{background:var(--ok);color:#fff;}
  .opt.wrong{border-color:#dc9a96;background:#fdf0ef;}
  .opt.wrong .opt-key{background:var(--bad);color:#fff;}
  .options.judge{flex-direction:row;gap:12px;}
  .options.judge .opt{flex:1;justify-content:center;padding:12px;}

  /* 解析 */
  .feedback{
    display:none;
    margin-top:14px;
    padding:14px 16px;
    border-radius:10px;
    background:#f8f4ea;
    border-left:3px solid var(--gold);
    font-size:13.5px;
    color:#4b5768;
    line-height:1.85;
  }
  .feedback.show{display:block;animation:fadeUp .3s ease;}
  .feedback .fb-row{margin-bottom:6px;}
  .feedback .fb-row:last-child{margin-bottom:0;}
  .fb-label{
    display:inline-block;
    font-size:11px;letter-spacing:.1em;
    color:#a4762f;
    margin-right:8px;
  }
  .fb-label::before{content:"▍";color:#c9a86a;}
  .fb-answer{font-weight:700;color:#1f7a58;}
  .fb-answer.bad{color:var(--bad);}

  /* 主观/计算 */
  .written{margin-top:4px;}
  .written textarea{
    width:100%;
    min-height:96px;
    padding:12px 14px;
    border:1px solid #e7ded0;
    border-radius:10px;
    background:#fdfcf9;
    font-family:inherit;
    font-size:14px;
    line-height:1.75;
    color:#2b3a4d;
    resize:vertical;
    outline:none;
    transition:.15s;
  }
  .written textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(46,92,138,.08);}
  .written textarea::placeholder{color:#b0b8c4;}
  .written-tools{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:10px;
  }
  .btn-ghost{
    appearance:none;cursor:pointer;
    border:1px solid #d9c79f;
    background:#fdfaf2;color:#8a6520;
    font-family:inherit;font-size:12.5px;
    padding:6px 14px;border-radius:8px;
    transition:.16s;letter-spacing:.03em;
  }
  .btn-ghost:hover{background:#f6edd9;}
  .self-grade{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);
    margin-left:auto;
  }
  .sg-btn{
    appearance:none;cursor:pointer;
    border:1px solid #e5ddcf;background:#fff;
    color:#6a7688;font-family:inherit;font-size:12px;
    padding:5px 11px;border-radius:999px;transition:.15s;
  }
  .sg-btn:hover{border-color:#c9a86a;color:#8a6520;}
  .sg-btn.active{background:#14243c;border-color:#14243c;color:#fff;}

  .answer-box{
    display:none;
    margin-top:12px;
    padding:16px 18px;
    border-radius:10px;
    background:#f7f2e6;
    border-left:3px solid #c9a86a;
    font-size:13.5px;
    color:#425065;
    line-height:1.95;
  }
  .answer-box.show{display:block;animation:fadeUp .3s ease;}
  .answer-box b{color:#1b2738;}
  .answer-box .ans-title{
    display:inline-block;
    font-size:11px;letter-spacing:.12em;
    color:#a4762f;margin-bottom:6px;
  }

  /* 底部操作 */
  .actions{
    display:flex;gap:12px;flex-wrap:wrap;
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .btn-primary{
    appearance:none;cursor:pointer;
    background:linear-gradient(135deg,#1b3253,#24446b);
    color:#fff;border:none;
    font-family:inherit;font-size:15px;letter-spacing:.08em;
    padding:13px 34px;border-radius:10px;
    box-shadow:0 8px 22px rgba(27,39,56,.18);
    transition:.18s;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(27,39,56,.24);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-secondary{
    appearance:none;cursor:pointer;
    background:#fff;border:1px solid var(--line);
    color:var(--ink-2);font-family:inherit;font-size:14px;
    padding:13px 26px;border-radius:10px;transition:.16s;
  }
  .btn-secondary:hover{border-color:#d9c79f;color:#8a6520;}

  .note{
    margin-top:34px;padding-top:22px;
    border-top:1px dashed #ddd0b4;
    font-size:12px;color:var(--muted);line-height:2;
    letter-spacing:.02em;
  }

  @media (max-width:720px){
    .hero-inner{padding:calc(36px + env(safe-area-inset-top)) 20px 32px;}
    .hero h1{font-size:28px;}
    .hero-stats{gap:16px;margin-top:22px;}
    .stat + .stat{padding-left:16px;}
    .tabs{grid-template-columns:repeat(2,1fr);}
    .wrap{padding:18px 14px calc(50px + env(safe-area-inset-bottom));}
    .q-card{padding:18px 18px 16px;}
    .q-stem{font-size:14.5px;}
    .toolbar{flex-wrap:wrap;gap:10px;padding:10px 14px;top:env(safe-area-inset-top);}
    .score-chip{border-left:none;padding-left:0;}
    .self-grade{margin-left:0;width:100%;}
    .options.judge{flex-direction:column;}
    .nav-btn{width:31px;height:31px;}
    /* iOS 聚焦输入框时不自动放大页面 */
    .written textarea{font-size:16px;}
    .opt{padding:12px 14px;}
    .tab{padding:12px 14px;}
  }

  @media print{
    .hero{background:#fff;color:#000;}
    .tabs,.toolbar,.nav-grid,.actions,.banner{display:none !important;}
    .q-card{break-inside:avoid;box-shadow:none;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Economics &amp; Finance · Freshman Review</div>
    <h1>微观经济学 <span>题库</span></h1>
    <p class="hero-sub">经济与金融专业 · 大一 · 考研方向 · 四轮闯关练习 · 选择 / 判断 / 计算 / 主观</p>
    <div class="hero-stats">
      <div class="stat"><b>4</b><span>练习轮次</span></div>
      <div class="stat"><b>100</b><span>题目总数</span></div>
      <div class="stat"><b>25</b><span>每轮题量</span></div>
      <div class="stat"><b>100</b><span>每轮满分</span></div>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" id="tabs"></nav>

  <div class="toolbar">
    <div class="progress-box">
      <div class="progress-text">
        <span>本轮进度 <b id="progText">0 / 25</b></span>
        <span id="progTip">未提交</span>
      </div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <div class="score-chip">本轮得分 <b id="scoreNum">—</b><span>/100</span></div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="nav-grid" id="navGrid"></div>

  <div id="questions"></div>

  <div class="actions">
    <button class="btn-primary" id="submitBtn">提交本轮</button>
    <button class="btn-secondary" id="resetBtn">重置本轮</button>
    <button class="btn-secondary" id="nextBtn">下一轮 →</button>
  </div>

  <div class="note">
    说明：单选、多选、判断为自动判分；计算题与主观题提供参考答案与解析，提交后可对照自评。<br>
    多选题计分规则：全部选对得满分，漏选（无错选）得一半分，错选得 0 分。<br>
    练习进度自动保存在本机浏览器中，可随时关闭页面后继续。
  </div>
</main>

<script>
/* ============================================================
   题库数据
   ============================================================ */
const L = ['A','B','C','D','E'];

const QB = [
/* ---------------------------- 第 1 轮 ---------------------------- */
{
  name:'第一轮',
  topic:'供需均衡 · 弹性理论 · 消费者行为',
  questions:[
    {
      type:'single', score:3,
      stem:'其他条件不变时，下列哪种情况会导致商品 X 的需求曲线向右移动？（　）',
      options:['替代品价格下降','替代品价格上升','互补品价格下降','消费者收入下降（X 为正常品）'],
      answer:1,
      explain:'替代品价格上升，消费者会减少对替代品的购买、增加对 X 的需求，X 的需求曲线右移。互补品价格下降也会使 X 需求增加，但选项中没有此条；收入下降使正常品需求左移。'
    },
    {
      type:'single', score:3,
      stem:'若某商品价格下降 10%，需求量增加 5%，则该商品需求价格弹性（绝对值）为（　）。',
      options:['2，富有弹性','0.5，缺乏弹性','1，单位弹性','0.5，富有弹性'],
      answer:1,
      explain:'需求价格弹性 Ed = |需求量变动率 / 价格变动率| = 5% / 10% = 0.5，小于 1，属于缺乏弹性。'
    },

      answer:'<span class="ans-title">参考答案</span><br><b>（1）特征：</b>① 非竞争性：增加一个消费者的边际成本为 0，不会影响他人消费；② 非排他性：难以排除他人免费使用，排除成本极高。同时具有两个特征的是纯公共物品，如国防、法律。<br><b>（2）市场失灵原因：</b>由于非排他性，消费者倾向于"搭便车"（free rider），即不付费也能消费，导致私人厂商无法通过收费弥补成本，市场供给严重不足，甚至为零。此外，公共物品的市场需求曲线是个人需求的垂直相加，市场机制难以揭示真实偏好。<br><b>（3）政府提供的依据：</b>政府可凭借征税权为公共物品融资，克服搭便车问题；政府提供能提高社会福利，实现资源配置的帕累托改进。<br><b>（4）注意：</b>政府提供不等于政府直接生产，可由政府出资、私人生产（如政府采购）；政府也面临公共选择和效率问题，需在市场失灵与政府失灵之间权衡。',

/* ============================================================
   状态与渲染
   ============================================================ */
const KEY = 'pe_qbank_v1';
let store = loadStore();

function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.rounds)) return s;
  }catch(e){}
  return { round:0, rounds:[] };
}
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}
function roundState(i){
  while(store.rounds.length <= i) store.rounds.push(null);
  if(!store.rounds[i]){
    store.rounds[i] = { answers:{}, submitted:false, reveal:{}, self:{} };
  }
  return store.rounds[i];
}
function hasAnswer(q,i,R){
  const a = R.answers[i];
  if(q.type === 'single' || q.type === 'judge') return a !== undefined && a !== null;
  if(q.type === 'multi') return Array.isArray(a) && a.length > 0;
  return typeof a === 'string' && a.trim().length > 0;
}
function gradeObjective(q, ans){
  if(q.type === 'single'){
    if(ans === undefined || ans === null) return 0;
    return Number(ans) === q.answer ? q.score : 0;
  }
  if(q.type === 'judge'){
    if(ans === undefined || ans === null) return 0;
    return String(ans) === String(q.answer) ? q.score : 0;
  }
  if(q.type === 'multi'){
    if(!Array.isArray(ans) || !ans.length) return 0;
    const sel = ans.map(Number);
    const wrong = sel.some(x => !q.answer.includes(x));
    if(wrong) return 0;
    if(sel.length === q.answer.length) return q.score;
    return q.score * 0.5;
  }
  return 0;
}
function fmt(n){
  return (Math.round(n * 10) / 10).toString().replace(/\.0$/, '');
}
function ansText(q){
  if(q.type === 'single') return L[q.answer] + '. ' + q.options[q.answer];
  if(q.type === 'multi') return q.answer.map(x => L[x]).join('、');
  return q.answer ? '正确' : '错误';
}

/* ---------- 卡片模板 ---------- */
function cardHTML(q, i, R, submitted){
  const idx = i + 1;
  const isObj = q.type === 'single' || q.type === 'multi' || q.type === 'judge';
  const gain = submitted && isObj ? gradeObjective(q, R.answers[i]) : null;

  let headGain = '';
  if(submitted){
    if(isObj){
      const g = gradeObjective(q, R.answers[i]);
      const cls = g === q.score ? '' : (g > 0 ? 'half' : 'zero');
      headGain = `<span class="q-gain ${cls}">${g > 0 ? '+' : ''}${fmt(g)} 分</span>`;
    } else {
      const s = R.self[i];
      if(s !== undefined){
        const g = s * q.score;
        const cls = s === 1 ? '' : (s > 0 ? 'half' : 'zero');
        headGain = `<span class="q-gain ${cls}">${g > 0 ? '+' : ''}${fmt(g)} 分</span>`;
      } else {
        headGain = `<span class="q-gain zero">待自评</span>`;
      }
    }
  }

  let body = '';
  if(q.type === 'single' || q.type === 'multi'){
    const mode = q.type === 'single' ? 'radio' : 'checkbox';
    body = `<div class="options">` + q.options.map((t, j) => {
      const a = R.answers[i];
      const chosen = q.type === 'single' ? a === j : (Array.isArray(a) && a.includes(j));
      let cls = 'opt';
      if(chosen) cls += ' chosen';
      if(submitted){
        if(q.answer === j) cls += ' correct';
        else if(chosen) cls += ' wrong';
      }
      return `<label class="${cls}">
        <input type="${mode}" name="q${i}" value="${j}" ${chosen ? 'checked' : ''} ${submitted ? 'disabled' : ''}>
        <span class="opt-key">${L[j]}</span>
        <span class="opt-text">${t}</span>
      </label>`;
    }).join('') + `</div>`;
  } else if(q.type === 'judge'){
    body = `<div class="options judge">` + [true, false].map(v => {
      const chosen = R.answers[i] !== undefined && String(R.answers[i]) === String(v);
      let cls = 'opt';
      if(chosen) cls += ' chosen';
      if(submitted){
        if(q.answer === v) cls += ' correct';
        else if(chosen) cls += ' wrong';
      }
      return `<label class="${cls}">
        <input type="radio" name="q${i}" value="${v}" ${chosen ? 'checked' : ''} ${submitted ? 'disabled' : ''}>
        <span class="opt-key">${v ? '✓' : '✕'}</span>
        <span class="opt-text">${v ? '正确' : '错误'}</span>
      </label>`;
    }).join('') + `</div>`;
  } else {
    const text = typeof R.answers[i] === 'string' ? R.answers[i] : '';
    const revealed = !!R.reveal[i];
    const self = R.self[i];
    body = `<div class="written">
      <textarea class="wr" data-idx="${i}" placeholder="在此写下你的思路与答案（可对照参考答案后自评）">${escapeHTML(text)}</textarea>
      <div class="written-tools">
        <button type="button" class="btn-ghost reveal" data-idx="${i}">${revealed ? '收起参考答案' : '查看参考答案'}</button>
        <div class="self-grade">自评：
          <button type="button" class="sg-btn ${self === 1 ? 'active' : ''}" data-idx="${i}" data-grade="1">满分 ${fmt(q.score)}</button>
          <button type="button" class="sg-btn ${self === 0.5 ? 'active' : ''}" data-idx="${i}" data-grade="0.5">一半 ${fmt(q.score * 0.5)}</button>
          <button type="button" class="sg-btn ${self === 0 ? 'active' : ''}" data-idx="${i}" data-grade="0">0 分</button>
        </div>
      </div>
      <div class="answer-box ${revealed ? 'show' : ''}" data-answer="${i}">${q.answer}</div>
    </div>`;
  }

  // 客观题解析
  let feedback = '';
  if(isObj && submitted){
    const g = gradeObjective(q, R.answers[i]);
    feedback = `<div class="feedback show">
      <div class="fb-row"><span class="fb-label">正确答案</span><span class="fb-answer ${g === q.score ? '' : 'bad'}">${ansText(q)}</span></div>
      <div class="fb-row"><span class="fb-label">解析</span>${q.explain}</div>
      </div>`;
  }

  return `<article class="q-card" data-type="${q.type}" data-idx="${i}" id="q${i}">
    <div class="q-head">
      <span class="q-no">${idx}</span>
      <span class="badge ${q.type}">${TYPE_LABEL[q.type]}</span>
      <span class="q-points"><b>${q.score}</b> 分</span>
      ${headGain}
    </div>
    <div class="q-stem">${q.stem}${q.sub ? `<span class="q-sub">${q.sub}</span>` : ''}</div>
    ${body}
    ${feedback}
  </article>`;
}

const TYPE_LABEL = { single:'单项选择', multi:'多项选择', judge:'判断', calc:'计算题', essay:'主观题' };

function escapeHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- 计分 ---------- */
function objectiveScore(round, R){
  return round.questions.reduce((sum, q, i) => {
    if(q.type === 'calc' || q.type === 'essay') return sum;
    return sum + gradeObjective(q, R.answers[i]);
  }, 0);
}
function selfScore(round, R){
  return round.questions.reduce((sum, q, i) => {
    if(q.type !== 'calc' && q.type !== 'essay') return sum;
    const s = R.self[i];
    return sum + (s === undefined ? 0 : s * q.score);
  }, 0);
}
function totalScore(round, R){
  return objectiveScore(round, R) + selfScore(round, R);
}

/* ---------- 界面渲染 ---------- */
const tabsEl = document.getElementById('tabs');
const questionsEl = document.getElementById('questions');
const navEl = document.getElementById('navGrid');
const bannerEl = document.getElementById('banner');
const progText = document.getElementById('progText');
const progBar = document.getElementById('progBar');
const progTip = document.getElementById('progTip');
const scoreNum = document.getElementById('scoreNum');

function renderTabs(){
  tabsEl.innerHTML = QB.map((r, i) => {
    const R = roundState(i);
    const done = R.submitted;
    const sc = done ? fmt(totalScore(r, R)) : '';
    return `<button class="tab ${store.round === i ? 'active' : ''}" data-round="${i}">
      <span class="t-name">${r.name}${sc ? `<span class="t-score">${sc} 分</span>` : ''}</span>
      <span class="t-topic">${r.topic}</span>
    </button>`;
  }).join('');
}

function render(){
  const round = QB[store.round];
  const R = roundState(store.round);

  renderTabs();

  questionsEl.innerHTML = round.questions.map((q, i) => cardHTML(q, i, R, R.submitted)).join('');

  // 导航
  navEl.innerHTML = `<div class="nav-hint">题号导航 · 点击可快速定位 · 提交后显示判分颜色</div>` +
    round.questions.map((q, i) => {
      const st = navStatus(q, i, R);
      return `<button class="nav-btn ${st}" data-jump="${i}">${i + 1}</button>`;
    }).join('');

  // 进度与得分
  const answered = round.questions.filter((q, i) => hasAnswer(q, i, R)).length;
  progText.textContent = answered + ' / ' + round.questions.length;
  progBar.style.width = (answered / round.questions.length * 100) + '%';
  progTip.textContent = R.submitted ? '已提交 · 可对照解析复盘' : '未提交';

  const sc = totalScore(round, R);
  if(R.submitted){
    scoreNum.textContent = fmt(sc);
    scoreNum.className = sc >= 60 ? 'pass' : 'fail';
  } else {
    scoreNum.textContent = '—';
    scoreNum.className = '';
  }

  // 成绩横幅
  if(R.submitted){
    const obj = objectiveScore(round, R);
    const self = selfScore(round, R);
    const level = sc >= 85 ? '优秀' : sc >= 70 ? '良好' : sc >= 60 ? '及格' : '需加强';
    const pending = round.questions.filter((q, i) =>
      (q.type === 'calc' || q.type === 'essay') && R.self[i] === undefined).length;
    bannerEl.className = 'banner show';
    bannerEl.innerHTML = `
      <div class="banner-top">
        <div class="banner-score">${fmt(sc)}<small> / 100</small></div>
        <div class="banner-level">${level}</div>
      </div>
      <div class="banner-detail">
        客观题（选择、判断）得分：<b>${fmt(obj)}</b> 分　·　计算与主观题自评得分：<b>${fmt(self)}</b> 分
        ${pending ? `<br>还有 <b>${pending}</b> 道计算/主观题未自评，点击题卡中的"自评"按钮可补评。` : ''}
        <br>绿色题号 = 正确，红色 = 错误，黄色 = 部分正确。点击题号可跳转查看解析。
      </div>`;
  } else {
    bannerEl.className = 'banner';
    bannerEl.innerHTML = '';
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = R.submitted;
  submitBtn.textContent = R.submitted ? '已提交本轮' : '提交本轮';
}

function navStatus(q, i, R){
  if(!R.submitted){
    return hasAnswer(q, i, R) ? 'answered' : '';
  }
  if(q.type === 'single' || q.type === 'judge'){
    return gradeObjective(q, R.answers[i]) === q.score ? 'correct' : 'wrong';
  }
  if(q.type === 'multi'){
    const g = gradeObjective(q, R.answers[i]);
    return g === q.score ? 'correct' : g > 0 ? 'partial' : 'wrong';
  }
  const s = R.self[i];
  if(s === undefined) return 'pending';
  return s === 1 ? 'correct' : s === 0 ? 'wrong' : 'partial';
}

/* ---------- 事件 ---------- */
tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  store.round = Number(btn.dataset.round);
  saveStore();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

navEl.addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if(!btn) return;
  const card = document.getElementById('q' + btn.dataset.jump);
  if(!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1000);
});

questionsEl.addEventListener('change', e => {
  const input = e.target;
  if(input.type !== 'radio' && input.type !== 'checkbox') return;
  const card = input.closest('.q-card');
  if(!card) return;
  const i = Number(card.dataset.idx);
  const type = card.dataset.type;
  const R = roundState(store.round);

  if(type === 'single'){
    R.answers[i] = Number(input.value);
  } else if(type === 'judge'){
    R.answers[i] = input.value === 'true';
  } else if(type === 'multi'){
    R.answers[i] = Array.from(card.querySelectorAll('input:checked')).map(x => Number(x.value));
  }

  card.querySelectorAll('.opt').forEach(label => {
    const inp = label.querySelector('input');
    label.classList.toggle('chosen', inp.checked);
  });

  saveStore();
  updateProgressUI();
});

questionsEl.addEventListener('input', e => {
  if(!e.target.classList.contains('wr')) return;
  const i = Number(e.target.dataset.idx);
  const R = roundState(store.round);
  R.answers[i] = e.target.value;
  saveStore();
  updateProgressUI();
});

questionsEl.addEventListener('click', e => {
  const revealBtn = e.target.closest('.reveal');
  if(revealBtn){
    const i = Number(revealBtn.dataset.idx);
    const R = roundState(store.round);
    R.reveal[i] = !R.reveal[i];
    const box = questionsEl.querySelector(`.answer-box[data-answer="${i}"]`);
    if(box) box.classList.toggle('show', R.reveal[i]);
    revealBtn.textContent = R.reveal[i] ? '收起参考答案' : '查看参考答案';
    saveStore();
    return;
  }

  const gBtn = e.target.closest('.sg-btn');
  if(gBtn){
    const i = Number(gBtn.dataset.idx);
    const val = Number(gBtn.dataset.grade);
    const R = roundState(store.round);
    R.self[i] = (R.self[i] === val) ? undefined : val;
    if(R.self[i] === undefined) delete R.self[i];

    const row = gBtn.parentElement;
    row.querySelectorAll('.sg-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.grade) === R.self[i]);
    });

    saveStore();
    render();
  }
});

function updateProgressUI(){
  const round = QB[store.round];
  const R = roundState(store.round);
  const answered = round.questions.filter((q, i) => hasAnswer(q, i, R)).length;
  progText.textContent = answered + ' / ' + round.questions.length;
  progBar.style.width = (answered / round.questions.length * 100) + '%';

  // 导航状态同步
  navEl.querySelectorAll('.nav-btn').forEach((btn, i) => {
    const q = round.questions[i];
    btn.className = 'nav-btn ' + navStatus(q, i, R);
  });
}

document.getElementById('submitBtn').addEventListener('click', () => {
  const round = QB[store.round];
  const R = roundState(store.round);
  if(R.submitted) return;

  const unanswered = round.questions.filter((q, i) => !hasAnswer(q, i, R)).length;
  if(unanswered > 0){
    const ok = confirm(`本轮还有 ${unanswered} 题未作答，确定要提交吗？`);
    if(!ok) return;
  }

  R.submitted = true;
  saveStore();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(!confirm('确定要清空本轮的作答、判分与自评记录吗？')) return;
  store.rounds[store.round] = { answers:{}, submitted:false, reveal:{}, self:{} };
  saveStore();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('nextBtn').addEventListener('click', () => {
  store.round = (store.round + 1) % QB.length;
  saveStore();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------- 启动 ---------- */
if(!Number.isInteger(store.round) || store.round < 0 || store.round >= QB.length){
  store.round = 0;
}
render();
</script>
